name: Backend Workflow

on:
  push:
    branches: [main, dev]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: StudentWrkSchedulingSystem-backend
        run: npm ci

      - name: Verify app entry
        working-directory: StudentWrkSchedulingSystem-backend
        run: test -f server.js
