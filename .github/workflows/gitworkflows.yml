name: Backend Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.AWS_DB_HOST }}
      DB_PW: ${{ secrets.AWS_DB_PW }}
      DB_USER: ${{ secrets.AWS_DB_USER }}
      DB_NAME: ${{ secrets.AWS_DB_NAME }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Create production env file
        run: |
          cat <<ENVFILE > .env
          DB_HOST="$DB_HOST"
          DB_PW="$DB_PW"
          DB_USER="$DB_USER"
          DB_NAME="$DB_NAME"
          DB_PORT="3306"
          PORT="3132"
          NODE_ENV="production"
          CLIENT_ID="$CLIENT_ID"
          CLIENT_SECRET="$CLIENT_SECRET"
          FRONTEND_ORIGINS="https://workerscheduling.eaglesoftwareteam.com,http://localhost:8081"
          ENVFILE

      - name: Bundle for deploy
        run: npm run bundle

      - name: Deploy files to server
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "deploy/"
          REMOTE_HOST: "workerscheduling.eaglesoftwareteam.com"
          REMOTE_USER: "ubuntu"
          TARGET: "nodeapps/sev2026/t2"

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: workerscheduling.eaglesoftwareteam.com
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/nodeapps/sev2026/t2
            npm ci --omit=dev
            sudo systemctl stop workerscheduling-t2-backend.service || true
            sudo cp workerscheduling-t2-backend.service /lib/systemd/system/workerscheduling-t2-backend.service
            sudo systemctl daemon-reload
            sudo systemctl start workerscheduling-t2-backend.service
            sudo systemctl status workerscheduling-t2-backend.service --no-pager -l || true
            # Smoke test: if app is reachable, fake Google token should return 401 (not 503).
            STATUS=$(curl -s -o /tmp/login-smoke.out -w "%{http_code}" -X POST http://127.0.0.1:3132/workerscheduling-t2/login -H "Content-Type: application/json" -d '{"credential":"smoke-test-invalid-token"}')
            cat /tmp/login-smoke.out
            if [ "$STATUS" -ne 401 ]; then
              echo "Unexpected login smoke-test status: $STATUS"
              exit 1
            fi
