name: Deploy Backend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate env vars
        run: |
          if [ -z "${DB_HOST}" ] || [ -z "${DB_USER}" ] || [ -z "${DB_PW}" ] || [ -z "${DB_NAME}" ] || [ -z "${CLIENT_ID}" ] || [ -z "${CLIENT_SECRET}" ]; then
            echo "Missing one or more required secrets"; exit 1;
          fi
        env:
          DB_HOST: ${{ secrets.AWS_DB_HOST }}
          DB_PORT: ${{ secrets.AWS_DB_PORT }}
          DB_USER: ${{ secrets.AWS_DB_USER }}
          DB_PW: ${{ secrets.AWS_DB_PW }}
          DB_NAME: ${{ secrets.AWS_DB_NAME }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Write production env
        run: |
          DB_PORT="${{ secrets.AWS_DB_PORT }}"
          if [ -z "${DB_PORT}" ]; then DB_PORT="3306"; fi
          PORT="${{ secrets.PORT }}"
          if [ -z "${PORT}" ]; then PORT="3132"; fi
          CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}"
          if [ -z "${CORS_ORIGIN}" ]; then CORS_ORIGIN="http://localhost:8081,https://workerscheduling.eaglesoftwareteam.com"; fi
          # VAPID keys gate web push. They are OPTIONAL here: if any of the
          # three secrets are unset the backend still boots and every push
          # send cleanly short-circuits with skippedReason:"vapid-not-
          # configured". The alternative — hard-failing when absent — would
          # turn a missing secret into a full production outage, which we
          # don't want. Set these three repo secrets to actually deliver
          # push notifications:
          #   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_EMAIL
          # Generate the keypair with: npx web-push generate-vapid-keys
          VAPID_EMAIL="${{ secrets.VAPID_EMAIL }}"
          if [ -z "${VAPID_EMAIL}" ]; then
            VAPID_EMAIL="mailto:admin@workerscheduling.eaglesoftwareteam.com"
          fi

          cat <<EOF > .env
          DB_HOST=${{ secrets.AWS_DB_HOST }}
          DB_PORT=${DB_PORT}
          DB_USER=${{ secrets.AWS_DB_USER }}
          DB_PW=${{ secrets.AWS_DB_PW }}
          DB_NAME=${{ secrets.AWS_DB_NAME }}
          CLIENT_ID=${{ secrets.CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
          CORS_ORIGIN=${CORS_ORIGIN}
          PORT=${PORT}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL=${VAPID_EMAIL}
          EOF

      - name: Bundle deploy artifacts
        run: npm run bundle

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "deploy/"
          REMOTE_HOST: "workerscheduling.eaglesoftwareteam.com"
          REMOTE_USER: "ubuntu"
          TARGET: "/home/ubuntu/nodeapps/sev2026/t2"

      - name: Install + restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: workerscheduling.eaglesoftwareteam.com
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/nodeapps/sev2026/t2
            npm ci --omit=dev
            npm run schema:sync
            npx sequelize-cli db:migrate || echo "⚠️ Migrations skipped (non-fatal)"
            sudo cp workerscheduling-t2-backend.service /etc/systemd/system/workerscheduling-t2-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable workerscheduling-t2-backend
            sudo systemctl reset-failed workerscheduling-t2-backend || true
            sudo systemctl restart workerscheduling-t2-backend
            sleep 5
            echo "=== SERVICE STATUS ==="
            sudo systemctl status workerscheduling-t2-backend --no-pager || true
            echo "=== LAST 40 LOG LINES ==="
            sudo journalctl -u workerscheduling-t2-backend -n 40 --no-pager || true
